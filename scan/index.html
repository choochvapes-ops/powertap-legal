<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TryPower — Rent a Power Bank</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0E0E10;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .logo span { color: #FFBF00; }
    h1 { font-size: 22px; font-weight: 700; margin: 24px 0 8px; }
    p { color: rgba(255,255,255,0.7); line-height: 1.5; font-size: 15px; margin: 0 0 24px; }
    .btn {
      display: block;
      background: #FFBF00;
      color: #000;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 12px;
    }
    .btn.secondary {
      background: transparent;
      color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .meta { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Try<span>Power</span></div>
    <h1>Open the TryPower app to rent</h1>
    <p id="msg">If you have the TryPower app installed, this link opens it automatically. Otherwise, download it to start your rental.</p>

    <a class="btn" id="appstore" href="https://apps.apple.com/app/id6773618856">Download TryPower</a>
    <a class="btn secondary" id="retry" href="#">Open in App</a>

    <div class="meta" id="station"></div>
  </div>

  <script>
    // Surface the scanned station/slot so the user (and support) can see it.
    var params = new URLSearchParams(window.location.search);
    var s = params.get('s');
    var sl = params.get('sl');
    if (s && sl !== null) {
      document.getElementById('station').textContent = 'Station ' + s + ' · Slot ' + sl;
    }
    // "Open in App" retries the universal link (helps when the app is installed
    // but iOS didn't intercept on first load).
    document.getElementById('retry').setAttribute('href', window.location.href);
  </script>
</body>
</html>
